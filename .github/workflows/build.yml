name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git perl clang libplist-utils fakeroot
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Download SDK and toolchain
        run: |
          mkdir -p $HOME/theos/sdks $HOME/theos/toolchain
          curl -sL -o $HOME/theos/sdks/iPhoneOS16.5.sdk.tar.xz "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xf $HOME/theos/sdks/iPhoneOS16.5.sdk.tar.xz -C $HOME/theos/sdks/
          # 使用系统 clang，Theos 会处理
      - name: Build
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/toolchain/linux/iphone/bin:$PATH
          make package FINALPACKAGE=1
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
