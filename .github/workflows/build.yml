name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Download SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -sL -o $HOME/theos/sdks/iPhoneOS16.5.sdk.tar.xz "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xf $HOME/theos/sdks/iPhoneOS16.5.sdk.tar.xz -C $HOME/theos/sdks/
      - name: Download toolchain
        run: |
          mkdir -p $HOME/theos/toolchain/linux/iphone
          url=$(curl -fsSL https://api.github.com/repos/kabiroberai/swift-toolchain-linux/releases/latest | grep browser_download_url | grep 'ubuntu22.04.tar.xz' | grep -v aarch64 | head -n1 | cut -d'"' -f4)
          curl -L --fail --retry 5 "$url" -o /tmp/toolchain.tar.xz
          tar -xf /tmp/toolchain.tar.xz -C $HOME/theos/toolchain/linux/iphone --strip-components=1
          TC=$HOME/theos/toolchain/linux/iphone
          [ -d "$TC/host/bin" ] && ln -sfn host/bin "$TC/bin" && ln -sfn host/lib "$TC/lib" || true
          rm -f "$TC/host/bin/ld" || true
          printf '#!/bin/sh\nexec "$(dirname "$0")/ld64.lld" "$@"\n' > "$TC/host/bin/ld" || true
          chmod +x "$TC/host/bin/ld" || true
      - name: Build
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
